name = "bonsai-feeds"
main = "worker.js"
compatibility_date = "2024-11-01"

# Refresh one source every 5 minutes (each source about every 2 hours).
[triggers]
crons = ["*/5 * * * *"]

# Optional overrides (worker.js has these defaults):
# [vars]
# SOURCES_URL = "https://atonioguy.github.io/bonsai/sources.json"
# ALLOW_ORIGIN = "https://atonioguy.github.io"

# Create once:  npx wrangler kv namespace create FEEDS
# then paste the printed id below and deploy.
[[kv_namespaces]]
binding = "FEEDS"
id = "PASTE_KV_NAMESPACE_ID_HERE"
